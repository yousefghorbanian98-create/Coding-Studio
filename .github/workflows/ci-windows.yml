name: CI (Windows)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to keep the queue short.
concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. The one step that needs write access declares it at
# job level instead, so nothing else in the workflow inherits it.
permissions:
  contents: read

env:
  # Never fetch the Rust toolchain's docs; keeps the runner fast.
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Lint, test and bundle on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write # only to post the E2E failure summary on the PR

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config so no later step or uploaded
          # artifact can carry it off the runner.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- Backend Factory mission validator --------------------------------
      # Deterministic, network-free mission validation before static analysis.
      - name: Validate frozen mission
        run: npm run validate:mission

      # ---- Static analysis -------------------------------------------------
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # ---- Unit / integration tests ---------------------------------------
      - name: Unit tests (Vitest)
        shell: bash
        # Captured so a Windows-only failure is readable from the job summary;
        # raw log storage is not reachable from every review environment.
        run: set -o pipefail && npm run test 2>&1 | tee vitest-output.txt

      - name: Summarise unit test failures
        if: failure()
        shell: bash
        run: |
          {
            echo '## Vitest failures'
            echo
            echo '```'
            tail -n 150 vitest-output.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > vitest-failures.md

      - name: Comment unit test failures on the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file vitest-failures.md

      # ---- End-to-end tests -------------------------------------------------
      - name: Build frontend
        run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        shell: bash
        # Captured so the failure is readable even when artifact and log
        # storage cannot be reached from a review environment.
        run: set -o pipefail && npm run test:e2e 2>&1 | tee pw-output.txt
        env:
          # Emit a machine-readable report next to the list output so failures
          # can be summarised below even when artifacts are unavailable.
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json

      # Surfaces the failing spec, message and stack in the job summary. This is
      # readable through the checks API, unlike raw logs behind artifact storage.
      # Surfaces the failing spec, message and stack. Written to the job
      # summary and mirrored to the pull request so the failure is visible
      # without downloading artifacts.
      - name: Summarise E2E failures
        if: failure()
        shell: bash
        run: |
          node .github/scripts/summarise-playwright.cjs | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f pw-output.txt ]; then
            {
              echo
              echo '<details><summary>Playwright console output (last 200 lines)</summary>'
              echo
              echo '```'
              tail -n 200 pw-output.txt
              echo '```'
              echo
              echo '</details>'
            } | tee -a "$GITHUB_STEP_SUMMARY" >> pw-failures.md
          fi

      - name: Comment E2E failures on the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as an environment variable rather than interpolated into the
          # script, so the value can never be expanded as shell code.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file pw-failures.md

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn

      # ---- Native desktop bundle ------------------------------------------
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      # Compiles the desktop crate and runs its unit tests. No external
      # service is required. Output is teed to a log so the follow-on step can
      # surface an excerpt as PR-visible annotations on failure (the authoring
      # sandbox has no installable Rust toolchain; CI is the compiler, and
      # annotations are the sandbox-readable failure channel).
      - name: Rust tests (cargo test)
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-features 2>&1 | tee "${RUNNER_TEMP}/cargo-test.log"
          exit ${PIPESTATUS[0]}

      # Milestone One: the Jcode compatibility layer is held to rustfmt +
      # clippy(-D warnings) so the contract surface stays reviewable.
      - name: Rust fmt + clippy
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee "${RUNNER_TEMP}/cargo-fmt.log" || fmt_rc=$?
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee "${RUNNER_TEMP}/cargo-clippy.log" || clippy_rc=$?
          exit $(( ${fmt_rc:-0} + ${clippy_rc:-0} > 0 ? 1 : 0 ))
      # Failure-diagnostic bridge (approved single exception): sits AFTER all
      # Rust gates so it captures test, fmt, and clippy output alike. It only
      # publishes excerpts; it changes nothing about the gates themselves.
      - name: Milestone One — surface Rust failure excerpt as annotations
        if: failure()
        shell: bash
        run: |
          log=""; for f in "${RUNNER_TEMP}/cargo-test.log" "${RUNNER_TEMP}/cargo-fmt.log" "${RUNNER_TEMP}/cargo-clippy.log"; do test -f "$f" && log="$log $f"; done
          test -n "$log" && {
            { { grep -aE "^Diff in |error(\[E[0-9]+\])?:|warning:|failures:|assertion .*(left|==)|panicked at|not ok" $log || true; } | head -40
              tail -60 "${RUNNER_TEMP}/cargo-fmt.log" "${RUNNER_TEMP}/cargo-clippy.log" 2>/dev/null
            } | awk '!seen[$0]++' | head -50 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"; line="${line//$'\r'/'%0D'}"
              printf '::error title=M1-cargo-ci::%s\n' "$line"
            done
          } || echo "::error title=M1-cargo-ci::rust gate failed before producing output"

      # Same pattern as the existing vitest/E2E failure comments: the PR gets a
      # readable excerpt the moment a Rust step fails (no log download needed).
      - name: Comment Milestone One cargo failure excerpt on the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Milestone One — Rust CI failure excerpt (auto-posted)'
            echo ''
            for f in "${RUNNER_TEMP}/cargo-fmt.log" "${RUNNER_TEMP}/cargo-clippy.log" "${RUNNER_TEMP}/cargo-test.log"; do
              if test -f "$f"; then
                echo "#### $(basename "$f")"
                echo '```diff' && tail -n 220 "$f" && echo '```'
              fi
            done
            ls "${RUNNER_TEMP}/cargo-"*.log >/dev/null 2>&1 || { echo '```text'; echo '(no log captured before failure)'; echo '```'; }
          } > m1-cargo-failures.md
          gh pr comment "$PR_NUMBER" --body-file m1-cargo-failures.md

      # ---------------------------------------------------------------------------
      # Slice B Diagnostic Bridge: when Rust gates fail, generate a complete
      # repair bundle containing the official rustfmt patch, Cargo.lock, and
      # all diagnostic logs. This allows the authoring sandbox (which has no
      # Rust toolchain) to apply exact fixes without guessing.
      # ---------------------------------------------------------------------------
      - name: Slice B — generate diagnostic repair bundle
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        working-directory: src-tauri
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          bundle_dir="${RUNNER_TEMP}/slice-b-diagnostic-bundle"
          mkdir -p "$bundle_dir"

          # Generate official rustfmt patch
          if command -v cargo >/dev/null 2>&1; then
            cargo fmt --all || true
            git diff --exit-code > "$bundle_dir/rustfmt.patch" 2>&1 || true

            # Record tool versions
            {
              echo "rustc: $(rustc --version)"
              echo "cargo: $(cargo --version)"
              echo "rustfmt: $(rustfmt --version)"
              echo "clippy: $(cargo clippy --version)"
            } > "$bundle_dir/tool-versions.txt"

            # Preserve Cargo.lock if it exists
            if [ -f Cargo.lock ]; then
              cp Cargo.lock "$bundle_dir/Cargo.lock"
            fi
          fi

          # Copy diagnostic logs
          for log in "${RUNNER_TEMP}/cargo-"*.log; do
            if [ -f "$log" ]; then
              cp "$log" "$bundle_dir/"
            fi
          done

          # Generate file checksums
          cd "$bundle_dir"
          sha256sum * > checksums.sha256 2>/dev/null || true

          # Create compressed archive
          cd "${RUNNER_TEMP}"
          tar -czf slice-b-bundle.tar.gz slice-b-diagnostic-bundle/
          sha256sum slice-b-bundle.tar.gz > slice-b-bundle.sha256

          # Post repair bundle as PR comment (if small enough)
          bundle_size=$(stat -c%s slice-b-bundle.tar.gz 2>/dev/null || stat -f%z slice-b-bundle.tar.gz 2>/dev/null || echo 0)
          if [ "$bundle_size" -lt 50000 ]; then
            # Encode as base64 and split into chunks
            base64 -w0 slice-b-bundle.tar.gz > slice-b-bundle.b64 2>/dev/null || base64 slice-b-bundle.tar.gz > slice-b-bundle.b64 2>/dev/null || true
            split -b 40000 slice-b-bundle.b64 slice-b-chunk- 2>/dev/null || split -l 1000 slice-b-bundle.b64 slice-b-chunk- 2>/dev/null || true

            {
              echo '### Slice B — Diagnostic Repair Bundle'
              echo ''
              echo 'This bundle contains the official rustfmt patch, Cargo.lock, and diagnostic logs.'
              echo ''
              echo '**Bundle SHA-256:**'
              echo '```'
              cat slice-b-bundle.sha256
              echo '```'
              echo ''
              echo '**Tool versions:**'
              echo '```'
              cat slice-b-diagnostic-bundle/tool-versions.txt 2>/dev/null || echo '(not available)'
              echo '```'
              echo ''

              # Post chunks if they exist
              chunk_count=$(ls slice-b-chunk-* 2>/dev/null | wc -l || echo 0)
              if [ "$chunk_count" -gt 0 ]; then
                echo '**Repair bundle (base64-encoded, chunked):**'
                echo ''
                i=1
                for chunk in slice-b-chunk-*; do
                  echo "<details><summary>Chunk $i of $chunk_count</summary>"
                  echo ''
                  echo '```'
                  cat "$chunk"
                  echo '```'
                  echo '</details>'
                  echo ''
                  i=$((i + 1))
                done

                echo '**Reconstruction:**'
                echo '```bash'
                echo 'cat slice-b-chunk-* | base64 -d > slice-b-bundle.tar.gz'
                echo 'sha256sum -c slice-b-bundle.sha256'
                echo 'tar -xzf slice-b-bundle.tar.gz'
                echo 'cd slice-b-diagnostic-bundle'
                echo 'git apply rustfmt.patch'
                echo 'cp Cargo.lock ../src-tauri/'
                echo '```'
              else
                echo 'Bundle too large to inline. Download from workflow artifacts.'
              fi
            } > slice-b-repair-bundle.md

            gh pr comment "$PR_NUMBER" --body-file slice-b-repair-bundle.md
          fi

      - name: Upload Slice B diagnostic bundle
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slice-b-diagnostic-bundle
          path: |
            ${{ runner.temp }}/slice-b-bundle.tar.gz
            ${{ runner.temp }}/slice-b-bundle.sha256
          retention-days: 7
          if-no-files-found: ignore

      - name: Tauri build
        # No signing keys are configured on purpose: this produces an unsigned
        # bundle. Code-signing and auto-update keys must live in repository
        # secrets and are deliberately absent from this workflow.
        run: npm run tauri build -- --ci

      - name: Upload Windows artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coding-studio-windows
          # productName is "Coding Studio", so the binary and installers are
          # named accordingly — globs keep this resilient to renames.
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*setup.exe
            src-tauri/target/release/*.exe
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Milestone One (m1-jcode-compat): optional integrity-verified probe of the
  # pinned official Jcode release. This job is deliberately separate from the
  # build job so ordinary frontend/unit CI never depends on a binary download.
  #
  # Safety properties (see docs/backend-factory/evidence/milestone-one/):
  #   - version-scoped download URL (v0.81.7), never a mutable "latest"
  #     alias; the pinned SHA-256 digest is the trust anchor
  #   - SHA-256 verified against the independently re-fetched official
  #     SHA256SUMS record AND the freeze-recorded expected digest
  #   - only the non-authenticated `version --json` command is executed
  #   - isolated temporary JCODE_HOME/JCODE_RUNTIME_DIR, telemetry disabled
  #   - hard timeout, stdout/stderr captured separately, cleanup at the end
  #   - no credentials, no provider login, no model inference, no paid API
  # ---------------------------------------------------------------------------
  jcode-release-probe:
    name: Jcode pinned-release probe (x86_64, integrity-verified)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      JCODE_PIN_TAG: v0.81.7
      JCODE_PIN_VERSION: 0.81.7
      JCODE_ASSET: jcode-windows-x86_64.exe
      # Recorded official digest (fixture sha256sums-v0.81.7.txt is byte-exact;
      # see PROVENANCE.md). The probe re-fetches the official SHA256SUMS and
      # requires both records and the downloaded file to agree.
      JCODE_EXPECTED_SHA256: b5b09dbe0dd0b14796dfa75f63decbdf98a75f3f9de9b86d6d25522ef3eb105b
    steps:
      - name: Download pinned release asset and official checksum record
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          base="https://github.com/1jehuang/jcode/releases/download/${JCODE_PIN_TAG}"
          curl -fsSL --retry 3 --retry-all-errors -o "${JCODE_ASSET}" "${base}/${JCODE_ASSET}"
          curl -fsSL --retry 3 --retry-all-errors -o SHA256SUMS "${base}/SHA256SUMS"

      - name: Verify SHA-256 integrity (three-way agreement)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          recorded="$(grep "  ${JCODE_ASSET}\$" SHA256SUMS | awk '{print $1}')"
          test -n "$recorded"
          echo "recorded official digest: $recorded"
          test "$recorded" = "$JCODE_EXPECTED_SHA256"
          actual="$(sha256sum "${JCODE_ASSET}" | awk '{print $1}')"
          test "$actual" = "$recorded"
          echo "verified sha256=$actual"

      - name: Run non-authenticated version probe in an isolated directory
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          export JCODE_HOME="$work/jcode-home"
          export JCODE_RUNTIME_DIR="$work/runtime"
          export JCODE_NO_TELEMETRY=1
          export DO_NOT_TRACK=1
          mkdir -p "$JCODE_HOME" "$JCODE_RUNTIME_DIR"
          set +e
          timeout 120 "./${JCODE_ASSET}" version --json >"$work/stdout.json" 2>"$work/stderr.txt"
          code=$?
          set -e
          echo "exit_code=$code"
          echo "--- stderr (diagnostics channel, never parsed as data) ---"
          cat "$work/stderr.txt" || true
          test "$code" -eq 0
          grep -q "\"semver\": \"${JCODE_PIN_VERSION}\"" "$work/stdout.json"
          grep -q "\"release_build\": true" "$work/stdout.json"
          echo "probe passed: ${JCODE_ASSET} reports ${JCODE_PIN_VERSION}, exit 0"
