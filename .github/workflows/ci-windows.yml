name: CI (Windows)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to keep the queue short.
concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never fetch the Rust toolchain's docs; keeps the runner fast.
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Lint, test and bundle on Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- Static analysis -------------------------------------------------
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # ---- Unit / integration tests ---------------------------------------
      - name: Unit tests (Vitest)
        run: npm run test

      # ---- End-to-end tests -------------------------------------------------
      - name: Build frontend
        run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e
        env:
          # Emit a machine-readable report next to the list output so failures
          # can be summarised below even when artifacts are unavailable.
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json

      # Surfaces the failing spec, message and stack in the job summary. This is
      # readable through the checks API, unlike raw logs behind artifact storage.
      - name: Summarise E2E failures
        if: failure()
        shell: bash
        run: |
          node -e "
          const fs=require('fs');
          const f='playwright-report/results.json';
          if(!fs.existsSync(f)){console.log('No JSON report produced.');process.exit(0)}
          const r=JSON.parse(fs.readFileSync(f,'utf8'));
          const out=[];
          const walk=(s)=>{for(const sp of s.suites??[])walk(sp);
            for(const t of s.specs??[]){if(t.ok)continue;
              for(const x of t.tests??[])for(const res of x.results??[]){
                out.push('### '+t.title+'\\n\\n\`\`\`\\n'+
                  ((res.error&&(res.error.message||''))+'\\n'+
                   (res.error&&res.error.stack||'')).slice(0,3000)+'\\n\`\`\`');}}};
          for(const s of r.suites??[])walk(s);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Playwright failures\\n\\n'+(out.join('\\n')||'none')+'\\n');
          "

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn

      # ---- Native desktop bundle ------------------------------------------
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Compiles the Ollama adapter and runs the wiremock-backed integration
      # tests. No real Ollama daemon is required: every HTTP call is served by
      # a local mock server started inside the tests.
      - name: Rust tests (cargo test)
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Tauri build
        # No signing keys are configured on purpose: this produces an unsigned
        # bundle. Code-signing and auto-update keys must live in repository
        # secrets and are deliberately absent from this workflow.
        run: npm run tauri build -- --ci

      - name: Upload Windows artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coding-studio-windows
          # productName is "Coding Studio", so the binary and installers are
          # named accordingly — globs keep this resilient to renames.
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*setup.exe
            src-tauri/target/release/*.exe
          retention-days: 14
          if-no-files-found: error
