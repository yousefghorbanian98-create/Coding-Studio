version: 2

# Actions are pinned to immutable commit SHAs (see ci-windows.yml), which is
# safe but freezes them. Dependabot keeps the pins current and rewrites both
# the SHA and its trailing version comment.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    labels:
      - dependencies
