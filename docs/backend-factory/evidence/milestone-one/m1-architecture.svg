<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="'Vazirmatn','Inter',ui-sans-serif,system-ui,'Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Milestone One — Jcode compatibility boundary</title>
  <desc id="d">React talks to the StudioRuntimeBridge; a future Tauri IPC edge reaches the Rust compatibility layer; the Jcode child process (daemon plus API bridge) is separated by the machine-protocol trust boundary; providers live behind the network boundary. TUI scraping, local models and Ollama are denied.</desc>

  <!-- Coding Studio design tokens (light theme, globals.css oklch -> hex) -->
  <!-- canvas #f7f7fa, surface #ffffff, surface-2 #f3f3f7, line #e3e4ea, ink #3d3a4d, ink-soft #6f6c80, brand #6d5ae6, brand-soft #eceafe, ok #2fa96b, warn #d99a2b, danger #d64545 -->

  <rect width="980" height="620" fill="#f7f7fa"/>

  <text x="32" y="42" font-size="20" font-weight="700" fill="#3d3a4d">Milestone One — the Jcode compatibility boundary</text>
  <text x="32" y="64" font-size="12.5" fill="#6f6c80">Structured NDJSON protocol only · fail closed · no terminal scraping · no local model runtime</text>

  <!-- Trust zone: Coding Studio process -->
  <rect x="32" y="92" width="916" height="180" rx="12" fill="#ffffff" stroke="#e3e4ea"/>
  <text x="52" y="118" font-size="13" font-weight="700" fill="#3d3a4d">TRUSTED — Coding Studio process</text>

  <g>
    <rect x="52" y="136" width="150" height="52" rx="8" fill="#eceafe" stroke="#6d5ae6"/>
    <text x="127" y="158" font-size="13" font-weight="600" fill="#3d3a4d" text-anchor="middle">React UI</text>
    <text x="127" y="176" font-size="10.5" fill="#6f6c80" text-anchor="middle">unchanged this milestone</text>

    <rect x="228" y="136" width="176" height="52" rx="8" fill="#eceafe" stroke="#6d5ae6"/>
    <text x="316" y="158" font-size="13" font-weight="600" fill="#3d3a4d" text-anchor="middle">StudioRuntimeBridge</text>
    <text x="316" y="176" font-size="10.5" fill="#6f6c80" text-anchor="middle">mock runtime (unchanged)</text>

    <rect x="430" y="136" width="150" height="52" rx="8" fill="#f3f3f7" stroke="#6f6c80" stroke-dasharray="4,3"/>
    <text x="505" y="158" font-size="13" font-weight="600" fill="#3d3a4d" text-anchor="middle">Tauri IPC</text>
    <text x="505" y="176" font-size="10.5" fill="#6f6c80" text-anchor="middle">future — Milestone Three</text>

    <rect x="606" y="132" width="322" height="60" rx="8" fill="#ffffff" stroke="#6d5ae6" stroke-width="2"/>
    <text x="767" y="154" font-size="13" font-weight="700" fill="#6d5ae6" text-anchor="middle">src-tauri/src/jcode — compatibility layer (THIS)</text>
    <text x="767" y="172" font-size="10.5" fill="#6f6c80" text-anchor="middle">version pin · checksums · NDJSON frames · normalized events</text>
    <text x="767" y="186" font-size="10.5" fill="#6f6c80" text-anchor="middle">capabilities (deny-by-default) · redaction · no credentials</text>
  </g>

  <!-- Machine protocol boundary -->
  <line x1="767" y1="192" x2="767" y2="252" stroke="#6d5ae6" stroke-width="2"/>
  <polygon points="767,192 760,204 774,204" fill="#6d5ae6"/>
  <polygon points="767,252 760,240 774,240" fill="#6d5ae6"/>
  <text x="781" y="226" font-size="11" fill="#6d5ae6" font-weight="600">harness API v1 · NDJSON · structured protocol</text>
  <text x="781" y="241" font-size="10.5" fill="#6f6c80">pipe \\.\pipe\jcode-api-&lt;hash16&gt; (Windows) · 4 MiB frame bound</text>

  <rect x="606" y="252" width="322" height="6" rx="3" fill="#6d5ae6" opacity="0.25"/>
  <text x="634" y="248" font-size="10" fill="#6d5ae6" letter-spacing="1">TRUST BOUNDARY — machine protocol (bridge is untrusted input)</text>

  <!-- Jcode child zone -->
  <rect x="226" y="258" width="608" height="130" rx="12" fill="#f3f3f7" stroke="#6f6c80" stroke-dasharray="6,4"/>
  <text x="246" y="284" font-size="13" font-weight="700" fill="#3d3a4d">JCODE CHILD PROCESSES — official binary v0.81.7 (SHA-256 verified)</text>

  <rect x="246" y="298" width="180" height="66" rx="8" fill="#ffffff" stroke="#e3e4ea"/>
  <text x="336" y="322" font-size="13" font-weight="600" fill="#3d3a4d" text-anchor="middle">jcode serve</text>
  <text x="336" y="339" font-size="10.5" fill="#6f6c80" text-anchor="middle">agent daemon (legacy socket)</text>
  <text x="336" y="353" font-size="10.5" fill="#6f6c80" text-anchor="middle">managed install · Milestone Two</text>

  <rect x="462" y="298" width="180" height="66" rx="8" fill="#ffffff" stroke="#e3e4ea"/>
  <text x="552" y="322" font-size="13" font-weight="600" fill="#3d3a4d" text-anchor="middle">jcode api-bridge</text>
  <text x="552" y="339" font-size="10.5" fill="#6f6c80" text-anchor="middle">harness API endpoint</text>
  <text x="552" y="353" font-size="10.5" fill="#6f6c80" text-anchor="middle">hello handshake · major v=1</text>

  <rect x="678" y="298" width="140" height="66" rx="8" fill="#ffffff" stroke="#e3e4ea"/>
  <text x="748" y="322" font-size="13" font-weight="600" fill="#3d3a4d" text-anchor="middle">stderr</text>
  <text x="748" y="339" font-size="10.5" fill="#6f6c80" text-anchor="middle">diagnostics only</text>
  <text x="748" y="353" font-size="10.5" fill="#6f6c80" text-anchor="middle">bounded · redacted</text>

  <line x1="426" y1="331" x2="462" y2="331" stroke="#6f6c80" stroke-width="1.5"/>
  <text x="444" y="320" font-size="9.5" fill="#6f6c80" text-anchor="middle">translates</text>

  <!-- Approval boundary -->
  <rect x="52" y="298" width="150" height="66" rx="8" fill="#fff7e8" stroke="#d99a2b"/>
  <text x="127" y="322" font-size="13" font-weight="700" fill="#3d3a4d" text-anchor="middle">Approval</text>
  <text x="127" y="339" font-size="10.5" fill="#6f6c80" text-anchor="middle">permission_request id</text>
  <text x="127" y="353" font-size="10.5" fill="#6f6c80" text-anchor="middle">human decision only</text>
  <line x1="202" y1="331" x2="226" y2="331" stroke="#d99a2b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="52" y="284" font-size="10" fill="#d99a2b" letter-spacing="0.6">APPROVAL BOUNDARY — the child may ask, never grant</text>

  <!-- Network / provider boundary -->
  <rect x="226" y="418" width="608" height="96" rx="12" fill="#fdecec" stroke="#d64545" stroke-dasharray="6,4"/>
  <text x="246" y="444" font-size="13" font-weight="700" fill="#d64545">PROVIDER / NETWORK BOUNDARY — Jcode-managed remote providers only</text>
  <text x="246" y="470" font-size="12" fill="#3d3a4d">Providers are configured by <tspan font-weight="700">jcode login</tspan> (auth handoff — Coding Studio stores nothing).</text>
  <text x="246" y="490" font-size="12" fill="#3d3a4d">Coding Studio never embeds a provider SDK and never calls provider APIs directly.</text>

  <line x1="530" y1="388" x2="530" y2="418" stroke="#d64545" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="544" y="408" font-size="10.5" fill="#d64545" font-weight="600">network egress owned by Jcode</text>

  <!-- Denied zone -->
  <rect x="52" y="530" width="796" height="64" rx="12" fill="#ffffff" stroke="#d64545" stroke-dasharray="4,3" opacity="0.9"/>
  <text x="68" y="556" font-size="12.5" font-weight="700" fill="#d64545">DENIED — structurally absent from the contract</text>
  <text x="68" y="578" font-size="11.5" fill="#6f6c80">TUI/ANSI scraping · Ollama · local model runtimes · local embeddings (default-off) · provider SDKs · credential storage in Coding Studio</text>
</svg>
