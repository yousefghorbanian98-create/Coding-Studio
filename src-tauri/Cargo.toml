[package]
name = "coding-studio"
version = "0.1.0"
description = "Coding Studio — AI pair-programming desktop workspace"
authors = ["Coding Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "coding_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust SHA-256 (RustCrypto). Needed to (a) reproduce Jcode's Windows
# named-pipe derivation `\\.\pipe\<stem>-<sha256(path)[..16]>` and
# (b) verify release assets against the official SHA256SUMS record.
# Adoption review: docs/backend-factory/evidence/milestone-one/oss-register.md
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
