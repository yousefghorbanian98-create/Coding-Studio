[package]
name = "coding-studio"
version = "0.1.0"
description = "Coding Studio — AI pair-programming desktop workspace"
authors = ["Coding Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "coding_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
